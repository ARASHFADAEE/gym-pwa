<header class="top">
  <div class="top-txt">
    <div class="overline" id="h-date"></div>
    <div class="h-title" id="h-title">باشگاه آرش</div>
  </div>
  <button class="ring-wrap" id="h-ring" aria-label="پیشرفت جلسه">
    <svg viewBox="0 0 48 48" class="ring"><defs><linearGradient id="g-acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a2b"/><stop offset="1" stop-color="#ff2d55"/></linearGradient></defs>
      <circle cx="24" cy="24" r="20" class="ring-bg"/><circle cx="24" cy="24" r="20" class="ring-fg" id="h-ring-fg"/></svg>
    <span id="h-ring-txt">—</span>
  </button>
</header>

<main id="main">
  <section id="view-workout" class="view active" aria-label="تمرین"></section>
  <section id="view-history" class="view" aria-label="تاریخچه"></section>
  <section id="view-body" class="view" aria-label="بدن"></section>
  <section id="view-music" class="view" aria-label="موزیک"></section>
  <section id="view-about" class="view" aria-label="درباره"></section>
</main>

<!-- rest timer: full overlay + minimized pill -->
<div id="timer" class="timer" role="timer" aria-live="polite" hidden>
  <button class="icon-btn timer-min" id="t-min" aria-label="کوچک کن"><svg class="i"><use href="#i-chevron-down"/></svg></button>
  <div class="timer-ex" id="timer-ex"></div>
  <div class="timer-dial">
    <svg viewBox="0 0 240 240" class="dial"><circle cx="120" cy="120" r="108" class="dial-bg"/><circle cx="120" cy="120" r="108" class="dial-fg" id="dial-fg"/></svg>
    <div class="dial-center">
      <div class="timer-label"><svg class="i sm"><use href="#i-timer"/></svg> استراحت</div>
      <div id="timer-time" class="timer-time">۰:۰۰</div>
      <div class="timer-sub" id="timer-sub"></div>
    </div>
  </div>
  <div class="timer-btns">
    <button id="t-plus" class="round-btn" aria-label="۱۵ ثانیه بیشتر"><svg class="i"><use href="#i-plus"/></svg><small>۱۵ث</small></button>
    <button id="t-skip" class="btn grad lg"><svg class="i"><use href="#i-skip-forward"/></svg> رد کن</button>
    <button id="t-minus" class="round-btn" aria-label="۱۵ ثانیه کمتر"><svg class="i"><use href="#i-minus"/></svg><small>۱۵ث</small></button>
  </div>
</div>
<button id="timer-pill" class="timer-pill" hidden><svg class="i sm"><use href="#i-timer"/></svg><span id="timer-pill-t">۰:۰۰</span></button>

<!-- now playing sheet -->
<div id="np" class="np" hidden aria-label="در حال پخش">
  <div class="np-bg"></div>
  <div class="np-top">
    <button class="icon-btn" id="np-close" aria-label="بستن"><svg class="i"><use href="#i-chevron-down"/></svg></button>
    <div class="overline">در حال پخش</div>
    <button class="icon-btn" id="np-list" aria-label="پلی‌لیست"><svg class="i"><use href="#i-list-checks"/></svg></button>
  </div>
  <div class="np-art" id="np-art"><div class="np-art-glow"></div><svg class="i np-art-ic"><use href="#i-audio-lines"/></svg><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="np-meta"><div class="np-title" id="np-title">—</div><div class="np-artist" id="np-artist"></div></div>
  <div class="seek-wrap"><input type="range" class="seek" id="seek" min="0" max="0" step="0.1" value="0" aria-label="نوار پیشرفت">
    <div class="times"><span id="p-cur">۰:۰۰</span><span id="p-dur">۰:۰۰</span></div></div>
  <div class="ctrls">
    <button id="p-rep" class="ctl" aria-label="تکرار"><svg class="i"><use href="#i-repeat"/></svg><span class="dot"></span></button>
    <button id="p-prev" class="ctl" aria-label="قبلی"><svg class="i lg flip"><use href="#i-skip-back"/></svg></button>
    <button id="p-play" class="ctl big" aria-label="پخش/توقف"><svg class="i xl"><use href="#i-play"/></svg></button>
    <button id="p-next" class="ctl" aria-label="بعدی"><svg class="i lg flip"><use href="#i-skip-forward"/></svg></button>
    <button id="p-shuf" class="ctl" aria-label="شافل"><svg class="i"><use href="#i-shuffle"/></svg><span class="dot"></span></button>
  </div>
  <div class="np-next" id="np-next"></div>
</div>

<!-- mini player -->
<div id="mini" class="mini" hidden>
  <div class="mini-prog"><i id="mini-prog"></i></div>
  <button class="mini-main" id="mini-open" aria-label="باز کردن پخش‌کننده">
    <span class="mini-art"><svg class="i sm"><use href="#i-audio-lines"/></svg></span>
    <span class="mini-info"><b id="mini-title">—</b><small id="mini-artist"></small></span>
  </button>
  <button id="mini-play" class="icon-btn solid" aria-label="پخش/توقف"><svg class="i"><use href="#i-play"/></svg></button>
  <button id="mini-next" class="icon-btn" aria-label="بعدی"><svg class="i flip"><use href="#i-skip-forward"/></svg></button>
</div>

<nav class="tabs" aria-label="بخش‌ها">
  <button data-tab="workout" class="active"><span class="tab-ic"><svg class="i"><use href="#i-dumbbell"/></svg></span>تمرین</button>
  <button data-tab="history"><span class="tab-ic"><svg class="i"><use href="#i-history"/></svg></span>تاریخچه</button>
  <button data-tab="body"><span class="tab-ic"><svg class="i"><use href="#i-scale"/></svg></span>بدن</button>
  <button data-tab="music"><span class="tab-ic"><svg class="i"><use href="#i-music"/></svg></span>موزیک</button>
  <button data-tab="about"><span class="tab-ic"><svg class="i"><use href="#i-info"/></svg></span>درباره</button>
</nav>

<audio id="audio" preload="metadata" playsinline></audio>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
